<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuno Beller Entwicklungstabelle</title>
    <!-- Vite injiziert das CSS automatisch über die main.js -->
</head>
<body>
    <!-- Feste Leiste oben (Punkt 3 deiner Anforderungen) -->
    <header class="l-header">
        <div class="l-header__content">
            <div class="c-child-info">
                Aktuelles Kind: <strong id="current-child-name">Keines ausgewählt</strong>
            </div>
            <div class="l-header__actions">
                <button type="button" id="edit-meta-btn" class="c-button c-button--secondary is-hidden">Bearbeiten</button>
                <button type="button" id="new-assessment" class="c-button c-button--secondary">Neu starten</button>
                <label class="c-button c-button--secondary">
                    Laden <input type="file" id="upload-json" accept=".kuno" hidden>
                </label>
                <button type="button" id="save-json" class="c-button c-button--primary is-hidden">JSON Backup</button>
                <button type="button" id="evaluate-btn" class="c-button c-button--primary is-hidden">Auswerten</button>
                <button type="button" id="export-pdf-eval" class="c-button c-button--success is-hidden">PDF: Auswertung</button>
                <button type="button" id="export-pdf-quest" class="c-button c-button--success is-hidden">PDF: Katalog</button>
                <button type="button" id="end-session" class="c-button c-button--danger is-hidden">Beenden</button>
            </div>
        </div>
    </header>

    <main class="l-container">
        <!-- Setup (Wird auch zum Editieren genutzt) -->
        <section id="setup-section" class="c-card">
            <h2 class="c-card__title" id="setup-title">Kind anlegen</h2>
            <div class="c-form-group">
                <label class="c-form-group__label" for="child-name">Vorname / Kürzel</label>
                <input class="c-form-group__input" type="text" id="child-name" placeholder="z.B. Max M.">
            </div>
            <div class="c-form-group">
                <label class="c-form-group__label" for="child-birthdate">Geburtsdatum</label>
                <input class="c-form-group__input" type="date" id="child-birthdate">
            </div>
            <div class="c-form-group">
                <label class="c-form-group__label" for="child-date">Datum der Beobachtung</label>
                <input class="c-form-group__input" type="date" id="child-date">
            </div>
            <button type="button" id="start-assessment" class="c-button c-button--primary">Speichern & Weiter</button>
        </section>

        <!-- Diagramm -->
        <section id="evaluation-section" class="c-evaluation is-hidden">
            <h2 class="c-evaluation__title">Entwicklungsprofil</h2>
            <div class="c-evaluation__meta" id="eval-meta" style="margin-bottom: 1rem;"></div>
            <div class="c-evaluation__chart-wrapper">
                <canvas id="kuno-chart"></canvas>
            </div>
        </section>

        <!-- Kompakte Schnellübersicht -->
        <section id="quick-overview-section" class="c-overview is-hidden u-page-break-before"></section>

        <!-- Fragen-Katalog -->
        <section id="assessment-section" class="is-hidden">
            <div id="question-container"></div>
        </section>
    </main>

    <!-- Entry Point für die App -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
