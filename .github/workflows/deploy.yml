name: Deploy to LimaCity - kunobella.4lima.de

on:
  workflow_dispatch:
#  push:
#    tags:
#      - 'v*' # Startet automatisch, wenn du z.B. v6.0.0 pushst
#  push:
#    branches:
#      - main # Ändere dies in 'master', falls dein Hauptbranch so heißt

jobs:
  deploy:
    name: 🚀 Build & Deploy SPA
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Code vom Repository holen
        uses: actions/checkout@v7.0.1

      - name: ⚙️ Node.js einrichten
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26' # Vite läuft perfekt ab v20 LTS
          cache: 'npm'

      - name: 📦 NPM Abhängigkeiten installieren
        run: npm ci

      - name: 🛠️ ZIP entpacken installieren
        run: sudo apt-get install -y unzip

      - name: 🔒 Fragen-Katalog entschlüsseln
        run: |
          cd src/assets/data
          unzip -P ${{ secrets.KUNO_SECRET_PASS }} questions.zip
          # Löscht das ZIP nach dem Entpacken, damit es nicht im Build landet
          rm questions.zip

      - name: 🛠️ Frontend Assets kompilieren (Vite Build)
        # Baut die App. Vite legt alles sauber im Ordner "dist/" ab.
        run: npm run build

      - name: 🌐 Dateien per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL }}
          port: ${{ vars.FTP_PORT }}
          # Das Server-Verzeichnis, z.B. /kunobella/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          # Lädt NUR den kompilierten Build-Ordner hoch, nicht den Quellcode!
          local-dir: ./dist/
          # Vite macht den dist Ordner schon sauber, wir schließen nur zur Sicherheit Git/Maps aus
          exclude: |
            **/*.map
            **/.git*
            **/.git*/**
